# =========================================
# DEV PROFILE - In-memory H2 database
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Useful for instantly testing the API without setting up MySQL.
# H2 Console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:ecommerce_db)
# =========================================

spring.datasource.url=jdbc:h2:mem:ecommerce_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,USERS
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
